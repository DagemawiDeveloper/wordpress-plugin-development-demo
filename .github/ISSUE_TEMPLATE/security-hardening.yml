name: Security hardening
about: Track a focused security or reliability improvement
title: "[Security] "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the reference plugin. Do not include active secrets or exploitable private details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the trust boundary, failure mode, or reliability gap.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain realistic impact without publishing sensitive data.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the behavior, tests, and documentation needed to close this issue.
    validations:
      required: true
