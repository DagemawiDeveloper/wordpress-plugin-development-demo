name: PHP quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Lint PHP files
        run: composer lint
      - name: Validate Gutenberg block metadata
        run: >-
          php -r '$block = json_decode(file_get_contents("blocks/integration-status/block.json"), true, 512, JSON_THROW_ON_ERROR); if (($block["name"] ?? "") !== "wp-integration-toolkit/integration-status" || ($block["apiVersion"] ?? 0) !== 2) { fwrite(STDERR, "Unexpected block metadata\n"); exit(1); }'
      - name: Check Gutenberg editor JavaScript syntax
        run: node --check blocks/integration-status/index.js
      - name: Run security and block unit tests
        run: composer test
